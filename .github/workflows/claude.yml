name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action grants only file/git/GitHub tools by default: no web access
          # and no Bash. Widen it to what a task on this repo actually needs —
          # reading linked material, and running the same gates CI runs.
          # Deliberately no `curl`/`wget`: WebFetch already covers fetching, and a
          # raw HTTP client in a job holding write tokens is a cleaner exfil path.
          claude_args: |
            --allowedTools "WebFetch,WebSearch,Bash(make test:*),Bash(make lint),Bash(bats:*),Bash(shellcheck:*),Bash(jq:*)"
