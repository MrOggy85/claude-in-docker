name: Tests
# Deny-list, not an allow-list: an allow-list silently skipped whole subsystems
# (proxy/, Dockerfile, templates/) that test/ actually covers. Only pure-prose
# paths are ignored. The two lists are duplicated on purpose — GitHub Actions'
# workflow parser rejects YAML anchors/aliases, so they cannot be shared.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
jobs:
  # macOS is a first-class host for run.sh / cid, and BSD userland is where this
  # repo breaks: stock macOS has shasum but not sha256sum, no setsid, no realpath,
  # and `sed -i` takes a mandatory backup suffix. fail-fast off so one platform's
  # failure does not hide the other's result.
  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit (3.0.0) rather than a mutable tag — same reasoning as
      # the base image digest and the npm lockfile.
      #
      # bats-version is set on purpose: left empty, the action resolves "latest"
      # through an unauthenticated api.github.com call, which is rate-limited per
      # runner IP and returns 403. That is what broke the master run.
      #
      # The four bats-* helper libraries are off: no test loads them (run.bats
      # defines its own assert_run_arg/refute_run_arg), and each one is another
      # tarball fetch that can fail the same way.
      - uses: bats-core/bats-action@2104b40bb7b6c2d5110b23a26b0bf265ab8027db
        with:
          bats-version: '1.14.0'
          support-install: 'false'
          assert-install: 'false'
          detik-install: 'false'
          file-install: 'false'
      - run: bats test/

  # An all-bash repo, so shellcheck is the type checker. See `make lint`.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Preinstalled on the ubuntu runner image; the fallback keeps the job
      # honest if that ever changes.
      - run: command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
      - run: make lint
