name: Tests
# Deny-list, not an allow-list: an allow-list silently skipped whole subsystems
# (proxy/, Dockerfile, templates/) that test/ actually covers. Only pure-prose
# paths are ignored. The two lists are duplicated on purpose — GitHub Actions'
# workflow parser rejects YAML anchors/aliases, so they cannot be shared.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bats-core/bats-action@3.0.0
      - run: bats test/
