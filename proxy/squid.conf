# Shared egress proxy for claude-in-docker. Explicit forward proxy: each
# container points HTTPS_PROXY here with its project key as the username.
# TLS is intercepted (ssl_bump) with a local CA the containers trust, so Squid
# sees each request's full URL and validates the upstream certificate itself.
# Hosts on the skip-decryption list are relayed undecrypted (Squid calls that
# splicing). See docs/tls-inspection.md.

# ssl-bump plus the CA that signs the per-host certificates Squid generates. The
# pair is copied to this proxy-owned path by proxy/entrypoint.sh; ca.key exists
# only here and on the host, never in a Claude container.
http_port 3128 ssl-bump \
  generate-host-certificates=on \
  dynamic_cert_mem_cache_size=8MB \
  tls-cert=/var/lib/squid/ca/ca.crt \
  tls-key=/var/lib/squid/ca/ca.key

# Signs and caches one certificate per bumped host.
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 8MB
sslcrtd_children 8 startup=1 idle=1

# --- Auth: the username carries the project key. ---------------------------
# auth-ok.sh accepts any credentials; the username is a self-asserted project
# tag selecting the allowlist. A container could borrow another key (accepted
# trade-off, see docs/egress-proxy.md).
auth_param basic program /etc/squid/src/auth-ok.sh
auth_param basic children 5
auth_param basic realm claude-egress
auth_param basic credentialsttl 24 hours
acl authenticated proxy_auth REQUIRED

# --- Per-project allowlist via external helper. ----------------------------
# Helper returns OK when <host> is in the baseline or project allowlist. ttl=2
# caches verdicts so list edits apply within 2s without a restart. Kept short
# rather than 0 (uncached) since the helper is a cheap file read, not free.
external_acl_type projacl ttl=2 children-max=20 %LOGIN %DST /etc/squid/src/ext-allowlist.sh
acl allowed_host external projacl

# --- Decrypt-or-not decision. ----------------------------------------------
# Same helper in --skip-decryption mode: OK means "tunnel this host without decrypting"
# (for clients that pin certificates). Everything else is bumped. Peek at step 1
# so the handshake is still available to splice (Squid's word for relaying it
# untouched); the decision matches on
# the CONNECT host, exactly like the allowlist.
external_acl_type skipdecryptacl ttl=2 children-max=20 %LOGIN %DST /etc/squid/src/ext-allowlist.sh --skip-decryption
acl skip_decryption_host external skipdecryptacl
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump splice skip_decryption_host
ssl_bump bump all

# Refuse upstream certificates Squid cannot validate (this is the default, stated
# because bumping makes the proxy — not the client — the party that checks them).
sslproxy_cert_error deny all

# Bumped connections reject protocol upgrades unless told otherwise, which would
# break the WebSocket traffic the read_timeout below exists for.
http_upgrade_request_protocols WebSocket allow all

# --- Method / port hygiene. ------------------------------------------------
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Auth first (populates %LOGIN), then the allowlist; fall-through is denied. Both
# the CONNECT and the decrypted requests inside it are checked: the inner requests
# cannot send Proxy-Authorization of their own (they believe they are talking to
# the origin), so Squid carries the connection's authenticated user into them.
http_access deny !authenticated
http_access allow allowed_host
http_access deny all

# --- Timeouts. -------------------------------------------------------------
# Long-lived tunnels (e.g. Slack Socket Mode WebSockets) idle between frames;
# the 15-min default read_timeout tore them down abruptly (no TLS close_notify).
read_timeout 4 hours

# --- Hardening / hygiene. --------------------------------------------------
# Don't advertise the proxy or leak the client to upstreams.
via off
forwarded_for delete
httpd_suppress_version_string on
cache deny all                     # policy gateway, not a cache
# Log to a file, not /dev/stdout: squid reopens the path after dropping to the
# 'proxy' user, but the container's stdout pipe is root-owned. Bumped requests log
# their full URL, minus query terms (strip_query_terms defaults to on). Watch with:
#   docker exec claude-egress-proxy tail -f /var/log/squid/access.log
access_log /var/log/squid/access.log
